<section class="tech-stack-section gn-panel fade">
  <div class="gn-panel__head gn-panel__head--teal">
    <span class="gn-panel__glyph">✎</span>tech stack
  </div>

  <div class="gn-panel__body">
    <div class="gn-tags">
      @for (tech of stack; track tech.label) {
        <span class="gn-tag" [class.gn-tag--peach]="tech.core">{{
          tech.label
        }}</span>
      }
    </div>
  </div>
</section>
