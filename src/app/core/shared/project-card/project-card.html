<div
  class="project-card"
  (click)="navigateToDetail()"
  role="button"
  tabindex="0"
>
  <h3 class="project-card__head">
    <span class="project-card__glyph">►</span>{{ project.title }}
  </h3>
  <img
    [src]="project.image"
    [alt]="project.title"
    class="project-card__image"
  />
  <div class="project-card__container">
    <p class="project-card__description">
      {{ project.description }}
    </p>
  </div>
</div>
