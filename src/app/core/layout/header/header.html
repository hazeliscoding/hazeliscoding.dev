<header class="header">
  <div class="header__top">
    <button
      class="hamburger-button"
      [class.hamburger-button--open]="isMenuOpen"
      (click)="toggleMenu()"
      aria-label="Toggle navigation menu"
    >
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>

    <a (click)="navigate('/')" class="mobile-brand">hazel.exe</a>
  </div>

  <div
    class="menu-overlay"
    [class.menu-overlay--open]="isMenuOpen"
    (click)="toggleMenu()"
  >
    <nav class="mobile-nav" (click)="$event.stopPropagation()">
      <div class="nav-links">
        <a
          class="mobile-nav__link"
          [ngClass]="{ 'mobile-nav__link--active': isActive('/') }"
          (click)="navigate('/'); toggleMenu()"
          >home</a
        >
        <a
          class="mobile-nav__link"
          [ngClass]="{ 'mobile-nav__link--active': isActive('/about') }"
          (click)="navigate('/about'); toggleMenu()"
          >about</a
        >
        <a
          class="mobile-nav__link"
          [ngClass]="{ 'mobile-nav__link--active': isActive('/portfolio') }"
          (click)="navigate('/portfolio'); toggleMenu()"
          >projects</a
        >
        <a
          class="mobile-nav__link"
          [ngClass]="{ 'mobile-nav__link--active': isActive('/blog') }"
          (click)="navigate('/blog'); toggleMenu()"
          >blog</a
        >
      </div>
    </nav>
  </div>

  <nav class="header__nav desktop-nav">
    <a
      class="header__link"
      [ngClass]="{ 'header__link--active': isActive('/') }"
      (click)="navigate('/')"
      >home</a
    >
    <a
      class="header__link"
      [ngClass]="{ 'header__link--active': isActive('/about') }"
      (click)="navigate('/about')"
      >about</a
    >
    <a
      class="header__link"
      [ngClass]="{ 'header__link--active': isActive('/portfolio') }"
      (click)="navigate('/portfolio')"
      >projects</a
    >
    <a
      class="header__link"
      [ngClass]="{ 'header__link--active': isActive('/blog') }"
      (click)="navigate('/blog')"
      >blog</a
    >
  </nav>

  <span class="header__crumb">⌂ members » <b>hazel</b></span>
</header>
