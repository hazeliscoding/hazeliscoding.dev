<div class="terminal-section-container">
  <section class="terminal-section">
    <div class="terminal-section__head">
      @if (isFirstTitle()) {
        <h1 class="terminal-section__title">
          <span class="terminal-section__glyph">☆</span>{{ customTitle() }}
        </h1>
      } @else {
        <h2 class="terminal-section__title">
          <span class="terminal-section__glyph">☆</span>{{ customTitle() }}
        </h2>
      }
    </div>

    <div class="terminal-section__body">
      <ng-content></ng-content>
    </div>
  </section>
</div>
