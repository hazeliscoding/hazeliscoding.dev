<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .mono { font-family: "Courier New", Courier, monospace; }
      .body { font-family: "Trebuchet MS", "Segoe UI", Tahoma, Verdana, sans-serif; }
    </style>
  </defs>

  <!-- White HC frame on black page -->
  <rect width="1200" height="630" fill="#ffffff" />
  <rect x="12" y="12" width="1176" height="606" fill="#000000" />

  <!-- Corner glints -->
  <path d="M8 2 C8.6 5.4 10.6 7.4 14 8 C10.6 8.6 8.6 10.6 8 14 C7.4 10.6 5.4 8.6 2 8 C5.4 7.4 7.4 5.4 8 2 Z"
    fill="none" stroke="#00ffff" stroke-width="1.5" stroke-linejoin="round"
    transform="translate(1032.8 42.8) scale(3.4)" />
  <path d="M8 2 C8.6 5.4 10.6 7.4 14 8 C10.6 8.6 8.6 10.6 8 14 C7.4 10.6 5.4 8.6 2 8 C5.4 7.4 7.4 5.4 8 2 Z"
    fill="none" stroke="#00ff66" stroke-width="1.5" stroke-linejoin="round"
    transform="translate(69.2 527.2) scale(2.6)" />

  <!-- Panel sticker shadow (hard offset, zero blur) -->
  <rect x="130" y="140" width="980" height="410" fill="#4d4d4d" />

  <!-- Panel -->
  <rect x="118" y="128" width="980" height="410" fill="#000000" stroke="#ffffff" stroke-width="4" />

  <!-- Panel head (inverse video) -->
  <rect x="120" y="130" width="976" height="62" fill="#00e65c" />
  <rect x="120" y="192" width="976" height="4" fill="#ffffff" />
  <text x="150" y="172" class="body" font-size="26" font-weight="bold" fill="#000000">☆ member profile</text>
  <text x="1066" y="171" text-anchor="end" class="body" font-size="22" fill="#000000">hazeliscoding.dev</text>

  <!-- Wordmark + sparkle -->
  <text x="160" y="308" class="mono" font-size="96" font-weight="bold" fill="#ffffff">hazel.exe</text>
  <g transform="translate(722 216) scale(6.2)">
    <path d="M8.6 2.6 C9.2 6 11.2 8 14.6 8.6 C11.2 9.2 9.2 11.2 8.6 14.6 C8 11.2 6 9.2 2.6 8.6 C6 8 8 6 8.6 2.6 Z"
      fill="none" stroke="#4d4d4d" stroke-width="1.5" stroke-linejoin="round" />
    <path d="M8 2 C8.6 5.4 10.6 7.4 14 8 C10.6 8.6 8.6 10.6 8 14 C7.4 10.6 5.4 8.6 2 8 C5.4 7.4 7.4 5.4 8 2 Z"
      fill="#000000" stroke="#00ff66" stroke-width="1.5" stroke-linejoin="round" />
  </g>

  <!-- Tagline -->
  <text x="160" y="376" class="body" font-size="30" fill="#c0c0c0">software developer — full-stack apps built with care and scalability</text>

  <!-- Tag pills -->
  <g>
    <rect x="160" y="410" width="150" height="46" rx="23" fill="#002222" stroke="#00ffff" stroke-width="2" />
    <text x="235" y="440" text-anchor="middle" class="body" font-size="22" font-weight="bold" fill="#b3ffff">C# / .NET</text>

    <rect x="326" y="410" width="122" height="46" rx="23" fill="#002222" stroke="#00ffff" stroke-width="2" />
    <text x="387" y="440" text-anchor="middle" class="body" font-size="22" font-weight="bold" fill="#b3ffff">Angular</text>

    <rect x="464" y="410" width="160" height="46" rx="23" fill="#002222" stroke="#00ffff" stroke-width="2" />
    <text x="544" y="440" text-anchor="middle" class="body" font-size="22" font-weight="bold" fill="#b3ffff">PostgreSQL</text>

    <rect x="640" y="410" width="90" height="46" rx="23" fill="#00220f" stroke="#00ff66" stroke-width="2" />
    <text x="685" y="440" text-anchor="middle" class="body" font-size="22" font-weight="bold" fill="#99ffc2">AWS</text>

    <rect x="746" y="410" width="112" height="46" rx="23" fill="#00220f" stroke="#00ff66" stroke-width="2" />
    <text x="802" y="440" text-anchor="middle" class="body" font-size="22" font-weight="bold" fill="#99ffc2">Docker</text>
  </g>

  <!-- Webring line -->
  <text x="608" y="512" text-anchor="middle" class="mono" font-size="22" fill="#808080">« projects ✦ blog ✦ about »</text>
